basePath: /
definitions:
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.AddJobRequest:
    properties:
      complexity_id:
        type: integer
      description:
        type: string
      duration_id:
        type: integer
      hire_manager_id:
        type: integer
      main_skill_id:
        type: integer
      payment_amount:
        type: number
      payment_type_id:
        type: integer
      required_skill_ids:
        items:
          type: integer
        type: array
      title:
        type: string
    required:
    - complexity_id
    - duration_id
    - hire_manager_id
    - main_skill_id
    - payment_type_id
    - title
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.ApplyJobRequest:
    properties:
      freelancer_comment:
        type: string
      payment_amount:
        type: number
      payment_type_id:
        type: integer
    required:
    - payment_amount
    - payment_type_id
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail:
    properties:
      error:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.FreelancerProfileRespond:
    properties:
      id:
        type: integer
      location:
        type: string
      overview:
        type: string
      registration_date:
        type: string
      user_account_id:
        type: integer
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.HirerProfileRespond:
    properties:
      company_id:
        type: integer
      company_location:
        type: string
      company_name:
        type: string
      id:
        type: integer
      location:
        type: string
      registration_date:
        type: string
      user_account_id:
        type: integer
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.Job:
    properties:
      complexity:
        type: string
      description:
        type: string
      duration:
        type: string
      hire_manager_name:
        type: string
      id:
        type: integer
      main_skill:
        type: string
      payment_amount:
        type: number
      payment_type:
        type: string
      required_skill:
        items:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.OtherSkill'
        type: array
      title:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.JobListRespond:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Job'
        type: array
      limit:
        type: integer
      page:
        type: integer
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.JobRespond:
    properties:
      data:
        $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Job'
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.OtherSkill:
    properties:
      other_skill:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignInInputUserAccount:
    properties:
      email:
        type: string
      password_hash:
        type: string
    required:
    - email
    - password_hash
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignUpInputUserAccount:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password_hash:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password_hash
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignUpRespond:
    properties:
      token:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.UpdateUserProfileRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.UserAccountProfileRespond:
    properties:
      email:
        type: string
      first_name:
        type: string
      has_freelancer_profile:
        type: boolean
      has_hirer_profile:
        type: boolean
      last_name:
        type: string
    type: object
  github_com_BUIHUUHAIDANG_freelance_market_internal_model.UserRespond:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
    type: object
info:
  contact: {}
  description: API for the Freelance Marketplace project.
  title: Freelance Marketplace API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies the supplied email and plain-text password.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignInInputUserAccount'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignUpRespond'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      summary: Sign in to a user account
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an account and hashes the supplied plain-text password.
      parameters:
      - description: Account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.SignUpInputUserAccount'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.UserRespond'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      summary: Register a user account
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API status
      tags:
      - health
  /job:
    get:
      description: Returns a paginated list of jobs with their required skills. Invalid
        page or limit values use defaults.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Jobs per page (maximum 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.JobListRespond'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      summary: Get all jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Hire Managers can create jobs for their own profile. Admin user
        IDs configured in ADMIN_USER_IDS can create jobs for any manager.
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.AddJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Create a job
      tags:
      - jobs
  /job/{jobid}:
    delete:
      description: Hire Managers can delete only their own jobs. Admin user IDs configured
        in ADMIN_USER_IDS can delete any job.
      parameters:
      - description: Job ID
        in: path
        name: jobid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Delete a job
      tags:
      - jobs
    get:
      description: Returns a job and its required skills.
      parameters:
      - description: Job ID
        in: path
        name: jobid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.JobRespond'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      summary: Get a job by ID
      tags:
      - jobs
    put:
      consumes:
      - application/json
      description: Hire Managers can update only their own jobs. Admin user IDs configured
        in ADMIN_USER_IDS can update any job.
      parameters:
      - description: Job ID
        in: path
        name: jobid
        required: true
        type: integer
      - description: Updated job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.AddJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Update a job
      tags:
      - jobs
  /job/{jobid}/apply:
    post:
      consumes:
      - application/json
      description: Creates a proposal for the authenticated freelancer. Admin user
        IDs configured in ADMIN_USER_IDS may also apply if they have a freelancer
        profile. The proposal starts with Pending status.
      parameters:
      - description: Job ID
        in: path
        name: jobid
        required: true
        type: integer
      - description: Proposal details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.ApplyJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Apply for a job
      tags:
      - jobs
  /user/me:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Delete my user account
      tags:
      - user account
    get:
      description: Returns basic account information and whether freelancer or hirer
        profiles exist for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.UserAccountProfileRespond'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Get my user account profile
      tags:
      - user account
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Update my user account profile
      tags:
      - user account
  /user/me/freelancer:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.FreelancerProfileRespond'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Get my freelancer profile
      tags:
      - user account
  /user/me/hirer:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.HirerProfileRespond'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BUIHUUHAIDANG_freelance_market_internal_model.Fail'
      security:
      - BearerAuth: []
      summary: Get my hirer profile
      tags:
      - user account
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
